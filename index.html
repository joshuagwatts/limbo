<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LIMBO — a portal universe</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<!-- full-screen fade used for portal transitions -->
<div id="fade"></div>

<!-- realm name title card shown after each transition -->
<div id="title-card"></div>

<!-- shown once per realm when all 5 echoes are collected -->
<div id="attuned">REALM ATTUNED</div>

<!-- celebration toast when attuning unlocks a skin or hat -->
<div id="unlock-toast"></div>

<!-- persistent HUD -->
<div id="hud">
  <div id="realm-name">THE NEXUS</div>
  <div id="echo-counter">ECHOES 0 / 20</div>
  <div id="peer-count">DRIFTERS HERE: 1</div>
  <div id="controls-hint">WASD / ARROWS — FLY&nbsp;&nbsp;·&nbsp;&nbsp;DRAG — LOOK&nbsp;&nbsp;·&nbsp;&nbsp;SPACE / SHIFT — RISE / SINK&nbsp;&nbsp;·&nbsp;&nbsp;T — CHAT&nbsp;&nbsp;·&nbsp;&nbsp;M — MUTE</div>
  <div id="mute-label">SOUND ON</div>
</div>

<!-- settings (gear) — wisp skins/hats, sound, drifter name, debug readout -->
<button id="gear-btn" aria-label="settings">&#9881;</button>
<div id="settings-panel">
  <div class="set-head"><span>SETTINGS</span><button id="settings-close" aria-label="close">&#10005;</button></div>
  <div class="set-row"><span class="set-label">SOUND</span><button id="sound-toggle">ON</button></div>
  <div class="set-row"><span class="set-label">DRIFTER NAME</span><input id="settings-name" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <div class="set-debug-head">WISP</div>
  <div class="set-sub">SKIN</div>
  <div id="wisp-skins" class="wisp-row"></div>
  <div class="set-sub">HAT</div>
  <div id="wisp-hats" class="wisp-row"></div>
  <div class="set-debug-head">NET DEBUG</div>
  <div id="settings-debug"></div>
</div>

<!-- room-local text chat with whoever is drifting here -->
<div id="chat">
  <button id="chat-toggle" aria-label="toggle chat history">&#128172;</button>
  <div id="chat-log"></div>
  <div id="chat-row">
    <input id="chat-input" maxlength="140" enterkeyhint="send" placeholder="say something to the drifters here…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="chat-send" aria-label="send">&#10148;</button>
  </div>
</div>

<!-- start overlay: the click also unlocks WebAudio -->
<div id="start-overlay">
  <h1>LIMBO</h1>
  <p class="sub">a portal universe</p>
  <input id="name-input" maxlength="16" placeholder="what do other drifters call you?" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="drift-btn" disabled>loading…</button>
  <!-- loading indicator while art textures download: in the overlay's column
       (under the button) so it can never overlap the title/subtitle -->
  <div id="loading"><span>summoning limbo</span></div>
  <p class="tiny">headphones recommended · 4 realms · 20 echoes</p>
</div>

<!-- minimal touch joystick UI -->
<div id="joy-base"><div id="joy-knob"></div></div>

<script type="module" src="js/game.js?v=8"></script>
</body>
</html>
